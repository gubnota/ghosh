[workspace]
members = ["crates/ghosh-core", "crates/ghosh-term", "crates/ghosh-ssh", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
